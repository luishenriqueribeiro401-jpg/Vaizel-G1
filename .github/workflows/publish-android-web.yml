name: Vaizel G1 oficial (Godot Web + MuJoCo + ONNX)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install JS runtimes
      working-directory: WebRuntime
      run: npm install --no-audit --no-fund
    - name: Download official assets, verify ONNX SHA256
      run: python3 WebRuntime/prepare_assets.py --output WebRuntime/public/vaizel_assets
    - name: Build MuJoCo WASM / ONNX bridge
      working-directory: WebRuntime
      run: |
        npm run validate
        npm run build
        python3 copy_wasm.py
    - name: Install Godot 4.4.1 and Web export templates
      run: |
        set -euo pipefail
        URL=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
        curl -fL --retry 3 -o /tmp/godot.zip "$URL/Godot_v4.4.1-stable_linux.x86_64.zip"
        unzip -oq /tmp/godot.zip -d /tmp
        chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
        curl -fL --retry 3 -o /tmp/web-templates.tpz "$URL/Godot_v4.4.1-stable_export_templates.tpz"
        unzip -oq /tmp/web-templates.tpz -d /tmp/godot-templates
        mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
        cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
    - name: Import and export original Godot world
      run: |
        set -euo pipefail
        mkdir -p site
        /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path GodotSandbox3D --editor --import --quit
        /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path GodotSandbox3D --export-release Web ../site/index.html
    - name: Stage native physics and official pretrained policy
      run: |
        cp -R WebRuntime/dist/. site/
        mkdir -p site/vaizel_assets
        cp -R WebRuntime/public/vaizel_assets/. site/vaizel_assets/
        printf '%s\n' 'VAIZEL G1: Unitree official policy, MuJoCo physics, Godot world.' > site/vaizel-build.txt
        test -s site/index.html
        test -s site/mujoco_wasm.wasm
        test -s site/vaizel_assets/policy.onnx
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
